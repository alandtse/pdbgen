name: CMake

on: [push]

jobs:
  build:
    runs-on: windows-latest

    # Needed by the release step (softprops/action-gh-release) to create releases.
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/checkout@v4
        with:
          path: llvm
          repository: llvm/llvm-project
          ref: refs/tags/llvmorg-16.0.0

      - uses: actions/cache/restore@v4
        id: cache
        with:
          path: llvm/build
          key: ${{ runner.os }}-llvmorg-16.0.0

      - name: Patch LLVM
        if: steps.cache.outputs.cache-hit != 'true'
        shell: cmd
        run: |
          dir
          git -C llvm apply ../llvm-debuginfo.patch

      - name: Initialize LLVM
        if: steps.cache.outputs.cache-hit != 'true'
        shell: cmd
        run: cmake -B llvm/build -S llvm/llvm

      - name:  Build LLVM
        if: steps.cache.outputs.cache-hit != 'true'
        shell: cmd
        run: cmake --build llvm/build --target llvm-pdbutil  --config Release

      - uses: actions/cache/save@v4
        if: steps.cache.outputs.cache-hit != 'true'
        with:
          path: llvm/build
          key: ${{ steps.cache.outputs.cache-primary-key }}

      - name: Build PDBGen
        shell: cmd
        run: |
          cmake -B build -S core -DLLVM_DIR=../llvm/build/lib/cmake/llvm
          cmake --build build --config Release

      - name: Organise Assets
        run: |
          mkdir assets
          copy build/Release/pdbgen.exe assets
          copy ghidra/PdbGen.java assets

      - uses: actions/upload-artifact@v4
        with:
          name: pdbgen
          path: assets/*

      # Releases are created only for version tags, and only on this repo — never on
      # forks or upstream pushes.
      - name: Package release assets
        if: startsWith(github.ref, 'refs/tags/v') && github.repository == 'alandtse/pdbgen'
        run: tar -acvf pdbgen.zip assets/*

      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/v') && github.repository == 'alandtse/pdbgen'
        uses: softprops/action-gh-release@v2
        with:
          files: pdbgen.zip
